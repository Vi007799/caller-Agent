<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
      :root { --bg-dark: #0f172a; --card-dark: #1e293b; }
      body { background-color: var(--bg-dark); color: #f1f5f9; font-family: 'Inter', sans-serif; }
      .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid
rgba(255,255,255,0.1); }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
      <header class="flex justify-between items-center mb-8">
          <div>
              <h1 class="text-3xl font-bold">AI Command Center</h1>
              <p class="text-slate-400">Enterprise Outbound Agent</p>
          </div>
          <div class="flex gap-3">
              <input type="password" id="admin-key" placeholder="Enter Admin Key" class="bg-slate-800
border border-slate-700 px-3 py-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
              <button onclick="loadDashboard()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2
rounded-lg transition text-sm">Refresh</button>
          </div>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="space-y-8">
              <section class="glass p-6 rounded-2xl">
                  <h3 class="text-xl font-semibold mb-4">Lead Operations</h3>
                  <div class="space-y-3">
                      <button onclick="openLeadModal()" class="w-full bg-blue-600 py-3 rounded-xl
font-medium">Add Single Lead</button>
                      <div class="relative">
                          <input type="file" id="file-upload" class="hidden" onchange="uploadFile()">
                          <button onclick="document.getElementById('file-upload').click()" class="w-full
bg-slate-700 py-3 rounded-xl transition">Upload XLSX/PDF</button>
                      </div>
                  </div>
              </section>
              <section class="glass p-6 rounded-2xl">
                  <h3 class="text-xl font-semibold mb-4">Persona</h3>
                  <textarea id="script-editor" class="w-full h-48 bg-slate-900 border border-slate-700
rounded-xl p-4 text-sm mb-4"></textarea>
                  <button onclick="saveScript()" class="w-full bg-green-600 py-2 rounded-lg">Save
Persona</button>
              </section>
          </div>

          <div class="lg:col-span-2 glass p-6 rounded-2xl">
              <h3 class="text-xl font-semibold mb-6">Lead Registry</h3>
              <table class="w-full text-left text-sm">
                  <thead class="text-slate-400 border-b border-slate-700">
                      <tr><th class="pb-3">Name</th><th class="pb-3">Phone</th><th
class="pb-3">Interest</th><th class="pb-3">Status</th></tr>
                  </thead>
                  <tbody id="lead-table-body" class="divide-y divide-slate-800"></tbody>
              </table>
          </div>
      </div>
  </div>

  <div id="lead-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4">
      <div class="glass p-8 rounded-3xl max-w-md w-full space-y-4">
          <h2 class="text-2xl font-bold">New Lead</h2>
          <input type="text" id="l-name" placeholder="Name" class="w-full bg-slate-900 border
border-slate-700 p-3 rounded-xl">
          <input type="text" id="l-phone" placeholder="Phone" class="w-full bg-slate-900 border
border-slate-700 p-3 rounded-xl">
          <input type="text" id="l-interest" placeholder="Interest" class="w-full bg-slate-900 border
border-slate-700 p-3 rounded-xl">
          <div class="flex gap-3">
              <button onclick="document.getElementById('lead-modal').style.display='none'" class="flex-1
py-3 rounded-xl bg-slate-700">Cancel</button>
              <button onclick="submitLead()" class="flex-1 py-3 rounded-xl bg-blue-600
font-bold">Save</button>
          </div>
      </div>
  </div>

  <script>
      const BASE_URL = window.location.origin;
      function getHeaders() {
          return { 'Content-Type': 'application/json', 'x-admin-key':
document.getElementById('admin-key').value };
      }

      async function loadDashboard() {
          try {
              const res = await fetch(`${BASE_URL}/api/dashboard`, { headers: getHeaders() });
              if (!res.ok) throw new Error("Unauthorized");
              const data = await res.json();
              document.getElementById('lead-table-body').innerHTML = data.leads.map(l => `
                  <tr class="hover:bg-slate-800/50 transition">
                      <td class="py-4">${l.fullName}</td><td class="py-4
text-slate-400">${l.phone}</td><td class="py-4">${l.interest || 'N/A'}</td><td class="py-4">${l.optOut ?
'Opted Out' : 'Ready'}</td>
                  </tr>`).join('');
          } catch (e) { alert(e.message); }
      }

      async function submitLead() {
          const lead = { name: document.getElementById('l-name').value, phone:
document.getElementById('l-phone').value, interest: document.getElementById('l-interest').value };
          await fetch(`${BASE_URL}/api/leads`, { method: 'POST', headers: getHeaders(), body:
JSON.stringify({ leads: [lead], consentConfirmed: true }) });
          document.getElementById('lead-modal').style.display = 'none';
          loadDashboard();
      }

      async function uploadFile() {
          const file = document.getElementById('file-upload').files[0];
          const formData = new FormData();
          formData.append('file', file);
          await fetch(`${BASE_URL}/api/leads/upload`, { method: 'POST', headers: { 'x-admin-key':
document.getElementById('admin-key').value }, body: formData });
          alert("Upload completed!");
          loadDashboard();
      }

      async function saveScript() {
          await fetch(`${BASE_URL}/api/admin/script`, { method: 'POST', headers: getHeaders(), body:
JSON.stringify({ prompt: document.getElementById('script-editor').value }) });
          alert("Persona saved!");
      }

      async function loadScript() {
          const res = await fetch(`${BASE_URL}/api/admin/script`, { headers: getHeaders() });
          if (res.ok) { const data = await res.json(); document.getElementById('script-editor').value =
data.script; }
      }

      function openLeadModal() { document.getElementById('lead-modal').style.display = 'flex'; }
      window.onload = () => { loadDashboard(); loadScript(); };
  </script>
</body>
  </html>
